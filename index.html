<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E6B52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>學習打卡</title>
<style>
:root{
  --bg:#F4F1E8;
  --card:#FFFFFF;
  --ink:#1C1E21;
  --muted:#6B7280;
  --line:#E5E0D4;
  --accent:#1E6B52;
  --accent-deep:#154D3C;
  --accent-soft:#E7F0EA;
  --done:#2E9E63;
  --seal:#B23A2E;
  --warn:#B7791F;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,'PingFang TC','Microsoft JhengHei','Noto Sans TC','Segoe UI',sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;
}
.app{max-width:520px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px;}
.num{font-variant-numeric:tabular-nums;}

/* ===== 頁首 ===== */
header.app-head{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + var(--safe-top)) 16px 10px;background:rgba(244,241,232,.92);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;}
.seal-logo{
  width:34px;height:34px;border-radius:9px;flex:none;border:2.5px solid var(--seal);color:var(--seal);
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 30%,rgba(178,58,46,.10),transparent 60%),rgba(255,255,255,.6);
}
.seal-logo svg{width:18px;height:18px;}
.brand .t{font-size:18px;font-weight:800;letter-spacing:.5px;}
.head-date{font-size:12px;color:var(--muted);text-align:right;line-height:1.3;}
.head-date b{display:block;font-size:13px;color:var(--ink);font-weight:600;}

/* ===== 主內容 ===== */
main{padding:14px 14px calc(84px + var(--safe-bottom));}
.view{display:none;}
.view.active{display:block;}
.sec-title{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--accent);margin:18px 2px 8px;}
.sec-title:first-child{margin-top:2px;}

/* ===== 卡片 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(28,30,33,.03);}
.card h3{font-size:14px;font-weight:700;margin-bottom:2px;}
.progress-card{background:linear-gradient(135deg,var(--accent-soft),#F2F7F3);border:1px solid #DCE9E1;}
.progress-row{display:flex;align-items:center;gap:14px;}
.ring{flex:none;width:74px;height:74px;}
.ring .bg{stroke:#DCE9E1;}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s ease;}
.ring .txt{font-size:18px;font-weight:800;fill:var(--accent-deep);}
.pg-info{flex:1;min-width:0;}
.pg-info .p1{font-size:13px;color:var(--accent-deep);font-weight:600;}
.pg-info .p2{font-size:22px;font-weight:800;margin:2px 0 1px;}
.pg-info .p2 small{font-size:13px;font-weight:600;color:var(--muted);}
.pg-info .p3{font-size:12px;color:var(--muted);}
.pg-meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.pg-meta .tag{font-size:11px;color:var(--accent-deep);background:#fff;border:1px solid #CFE3D8;border-radius:999px;padding:3px 10px;}

/* ===== 學習項目卡 ===== */
.item{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;}
.item .name{font-size:15px;font-weight:700;padding-right:74px;}
.chip{display:inline-block;padding:1px 8px;border-radius:7px;font-size:11px;font-weight:600;margin-top:7px;}
.item .note{font-size:12.5px;color:#4B5563;margin-top:7px;}
.item .dur{position:absolute;top:14px;right:14px;font-size:12px;color:var(--muted);}
.done-line{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:12.5px;color:var(--done);font-weight:700;}
.done-line svg{width:15px;height:15px;flex:none;}
.check-btn{
  margin-top:10px;width:100%;padding:12px;border-radius:12px;background:var(--accent);color:#fff;
  font-size:14px;font-weight:700;letter-spacing:1px;transition:transform .08s ease,background .2s ease;
}
.check-btn:active{transform:scale(.98);}
.check-btn.ghost{background:transparent;color:var(--muted);border:1px dashed var(--line);font-weight:600;}

/* 印章（簽名元素） */
.seal{
  position:absolute;right:10px;top:10px;width:60px;height:60px;
  border:3px solid var(--seal);border-radius:11px;color:var(--seal);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;letter-spacing:2px;transform:rotate(-9deg);
  background:radial-gradient(circle at 28% 28%,rgba(178,58,46,.10),transparent 55%),
             radial-gradient(circle at 74% 70%,rgba(178,58,46,.13),transparent 60%),
             rgba(255,255,255,.6);
  box-shadow:0 2px 5px rgba(178,58,46,.20);
  animation:stamp .42s cubic-bezier(.34,1.56,.64,1);
}
@keyframes stamp{
  0%{transform:rotate(-9deg) scale(1.7);opacity:0;}
  60%{transform:rotate(-9deg) scale(.94);opacity:1;}
  100%{transform:rotate(-9deg) scale(1);}
}
.item.is-done{border-color:#CBE3D2;background:#FCFEFC;}

/* 新增自訂 */
.add-form{display:none;margin-top:10px;}
.add-form.open{display:block;}
.add-form input{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:14px;font-family:inherit;background:#FBF9F3;color:var(--ink);
}
.add-form input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.add-form .row2{display:flex;gap:8px;margin-top:8px;align-items:center;}
.add-form .row2 input.dur{flex:0 0 96px;}
.add-form .row2 .ok{flex:1;background:var(--accent);color:#fff;border-radius:10px;padding:12px;font-size:14px;font-weight:700;}
.add-form .row2 .cancel{background:transparent;color:var(--muted);}

/* ===== 計畫 ===== */
.day-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;}
.day-card .d-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.day-card .d-name{font-size:14px;font-weight:800;}
.day-card .d-total{font-size:12px;color:var(--muted);}
.plan-item{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px dashed var(--line);}
.plan-item:first-of-type{border-top:none;padding-top:2px;}
.plan-item .pd{flex:1;min-width:0;}
.plan-item .pn{font-size:13.5px;font-weight:700;}
.plan-item .pdur{font-size:11.5px;color:var(--muted);margin-top:1px;}
.day-card.weekend{border-color:#B9CFE4;}

/* ===== 統計 ===== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px;}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;}
.stat-card .sv{font-size:25px;font-weight:800;color:var(--accent-deep);}
.stat-card .sv small{font-size:14px;}
.stat-card .sl{font-size:12px;color:var(--muted);margin-top:2px;}
.stat-card.heat .sv{color:var(--seal);}
.bars{display:flex;align-items:flex-end;gap:8px;height:128px;padding-top:4px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;}
.bar-track{width:100%;max-width:26px;background:#EDE9DC;border-radius:6px 6px 3px 3px;position:relative;overflow:hidden;flex:1;}
.bar-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,var(--accent),#4C8A6F);border-radius:6px 6px 3px 3px;transition:height .4s ease;}
.bar-col.done-full .bar-fill{background:linear-gradient(180deg,var(--done),#5BB381);}
.bar-col .bl{font-size:10px;color:var(--muted);}
.bar-col .bv{font-size:10px;color:var(--muted);}
.stats-note{font-size:12px;color:var(--muted);margin-top:10px;}

/* ===== 記錄 ===== */
.hist-empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:13px;}
.hist-empty .big{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.hist-day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;}
.hist-day .hd{display:flex;align-items:center;justify-content:space-between;}
.hist-day .hd .dl{font-size:13.5px;font-weight:700;}
.hist-day .hd .dl small{color:var(--muted);font-weight:600;margin-left:6px;}
.hist-day .hd .st{font-size:12px;font-weight:700;}
.hist-day .st.full{color:var(--done);}
.hist-day .st.part{color:var(--warn);}
.hist-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.hist-chip{font-size:11px;color:#3B3C3D;padding:2px 8px;border-radius:7px;}

/* ===== 底部導覽 ===== */
nav.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:30;
  display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding-bottom:var(--safe-bottom);
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;color:var(--muted);font-size:11px;font-weight:600;min-height:56px;justify-content:center;}
.tab svg{width:22px;height:22px;}
.tab.active{color:var(--accent-deep);}
.tab.active svg{stroke:var(--accent-deep);}
/* ===== 番茄鐘 ===== */
.pomo-card{text-align:center;}
.pomo-mode{display:flex;gap:8px;justify-content:center;margin-bottom:12px;}
.mode-btn{flex:1;max-width:120px;padding:9px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);background:#FBF9F3;border:1px solid var(--line);}
.mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.pomo-subj{font-size:13px;color:var(--accent-deep);font-weight:600;margin-bottom:10px;}
.pomo-ring-wrap{position:relative;width:200px;margin:0 auto;}
.pomo-ring{display:block;}
.pomo-ring .bg{stroke:#E6E2D4;}
.pomo-ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s linear;}
.pomo-time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;letter-spacing:1px;color:var(--ink);}
.pomo-controls{display:flex;gap:8px;margin-top:16px;}
.pomo-controls .check-btn{flex:1;margin:0;}
.dots{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap;}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);background:transparent;}
.dot.filled{background:var(--accent);}
.dot-note{font-size:12px;color:var(--muted);margin-left:4px;}
.dot-note b{color:var(--accent-deep);}
.pomo-note{font-size:12px;color:var(--muted);margin-top:8px;}
.dur-card .dur-title{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px;}
.dur-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px dashed var(--line);font-size:13px;}
.dur-row:first-of-type{border-top:none;}
.stepper{display:flex;align-items:center;gap:10px;}
.stepper button{width:32px;height:32px;border-radius:9px;background:#FBF9F3;border:1px solid var(--line);font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;}
.stepper span{min-width:30px;text-align:center;font-size:14px;font-weight:700;}
/* 音樂播放 */
#musicUrl{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;background:#FBF9F3;color:var(--ink);}
#musicUrl:focus{outline:2px solid var(--accent);outline-offset:1px;}

@media (prefers-reduced-motion:reduce){
  .seal{animation:none;}
  .ring .fg,.bar-fill{transition:none;}
}
</style>
</head>
<body>
<div class="app">
  <header class="app-head">
    <div class="brand">
      <div class="seal-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>
      </div>
      <div class="t">學習打卡</div>
    </div>
    <div class="head-date"><b id="headDateLabel">—</b><span id="headDateSub">—</span></div>
  </header>

  <main>
    <section class="view" id="view-today" data-route="today"></section>
    <section class="view" id="view-pomodoro" data-route="pomodoro"></section>
    <section class="view" id="view-plan" data-route="plan"></section>
    <section class="view" id="view-stats" data-route="stats"></section>
    <section class="view" id="view-history" data-route="history"></section>
  </main>

  <nav class="tabbar" aria-label="主要導覽">
    <button class="tab" data-go="today" aria-label="今日打卡">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 2.8V6M16 2.8V6"/><path d="M9.5 15.5 11.5 17.5 15 13.5"/></svg>
      <span>今日</span>
    </button>
    <button class="tab" data-go="pomodoro" aria-label="番茄鐘">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7.5"/><path d="M12 5V3M9 2.5h6"/><path d="M12 9.5V13l2.6 1.6"/></svg>
      <span>番茄鐘</span>
    </button>
    <button class="tab" data-go="plan" aria-label="每週計畫">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5h11a3 3 0 0 1 3 3V20H7a3 3 0 0 1-3-3V4.5Z"/><path d="M7 20a3 3 0 0 1 0-6h11"/><path d="M8 9h6M8 12.5h4"/></svg>
      <span>計畫</span>
    </button>
    <button class="tab" data-go="stats" aria-label="統計">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>統計</span>
    </button>
    <button class="tab" data-go="history" aria-label="打卡記錄">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>記錄</span>
    </button>
  </nav>
</div>

<script>
(function(){
'use strict';

/* ===== 工具 ===== */
function pad(n){return (n<10?'0':'')+n;}
function dateObj(str){var p=str.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function shiftKey(key,days){var d=dateObj(key);d.setDate(d.getDate()+days);return keyOf(d);}
function weekdayOf(key){return dateObj(key).getDay();} /* 0=日 … 6=六 */
function nowTime(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ===== 科目配色 ===== */
var CATS={
  ch:{bg:'#ECEAF9',bd:'#9EACEA'},
  en:{bg:'#FBE7EB',bd:'#EAA7B2'},
  ma:{bg:'#E4F4EF',bd:'#94D8C3'},
  ac:{bg:'#FBEADF',bd:'#F4B393'},
  ec:{bg:'#F6F0D9',bd:'#E4D48F'},
  pc:{bg:'#E7F2F7',bd:'#A3D5E8'},
  bu:{bg:'#F0EAF7',bd:'#C9A7E8'},
  rev:{bg:'#EFEBDD',bd:'#C9C2AD'},
  cu:{bg:'#E7F0EA',bd:'#8FB8A4'}
};
var CATNAME={ch:'國文',en:'英文',ma:'數學',ac:'會計',ec:'經濟',pc:'電腦',bu:'商業',rev:'總複習',cu:'自訂'};

/* ===== 每週計畫，索引對應 getDay()：0=日 1=一 2=二 3=三 4=四 5=五 6=六 ===== */
var PLAN=[
  [/*日*/{subj:'預習國文＋英文',dur:90,note:'預習下週進度',cat:'rev'},
         {subj:'預習數學＋會計／經濟',dur:90,note:'預習下週進度',cat:'rev'},
         {subj:'整理筆記＋訂目標',dur:75,note:'錯題本整理、訂下週目標，21:30 前收工',cat:'rev'}],
  [/*一*/{subj:'英文',dur:60,note:'背單字 10 個＋複習當天英語會話句型',cat:'en'},
         {subj:'數學',dur:60,note:'複習當天應用數學進度＋練 3~5 題',cat:'ma'}],
  [/*二*/{subj:'會計',dur:70,note:'複習當天進度＋分錄／報表練習',cat:'ac'},
         {subj:'電腦實作',dur:50,note:'複習當天數位科技／軟體操作',cat:'pc'}],
  [/*三*/{subj:'經濟',dur:70,note:'複習當天進度＋名詞與圖表整理',cat:'ec'},
         {subj:'會計',dur:50,note:'趁記憶新鮮補弱點、做錯題',cat:'ac'}],
  [/*四*/{subj:'數學',dur:70,note:'練弱點題型＋當天進度習題',cat:'ma'},
         {subj:'英文',dur:50,note:'單字複習＋文法筆記整理',cat:'en'}],
  [/*五*/{subj:'經濟',dur:60,note:'當週重點統整＋整理名詞表',cat:'ec'},
         {subj:'國文',dur:60,note:'課文／註釋複習、完成作業',cat:'ch'}],
  [/*六*/{subj:'國英數總複習',dur:90,note:'當週總複習＋錯題回顧',cat:'rev'},
         {subj:'會計／經濟',dur:90,note:'重點整理＋習題演練',cat:'ac'},
         {subj:'商業實務',dur:90,note:'複習＋完成作業',cat:'bu'},
         {subj:'電腦練習＋小測',dur:60,note:'數位／軟體／資料庫操作＋當週小測',cat:'pc'}]
];
var DAYNAME=['週日','週一','週二','週三','週四','週五','週六'];
var DAYNOTE=['預習收心日','平日','平日','平日','平日','平日','深度複習日'];
function isWeekendKey(key){var w=weekdayOf(key);return w===0||w===6;}

/* ===== 資料 ===== */
var LS_KEY='studyCheckin_v1';
var POMO_DEF={mode:'focus',running:false,endAt:null,left:25*60,focusInCycle:0,total:0,subject:'',dur:{focus:25,short:5,long:15}};
var MUSIC_DEF={url:'',history:[],volume:0.7};
var state=load();
function load(){
  var d={records:{},pomo:JSON.parse(JSON.stringify(POMO_DEF)),music:JSON.parse(JSON.stringify(MUSIC_DEF))};
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(raw){
      var o=JSON.parse(raw);
      if(o){
        if(o.records)d.records=o.records;
        if(o.pomo)d.pomo=Object.assign({},POMO_DEF,o.pomo);
        if(o.music)d.music=Object.assign({},MUSIC_DEF,o.music);
      }
    }
  }catch(e){}
  return d;
}
function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}
}
function rec(key){
  if(!state.records[key])state.records[key]={plan:[],custom:[]};
  var r=state.records[key];
  if(r.plan.length===0){
    var sessions=PLAN[weekdayOf(key)];
    for(var i=0;i<sessions.length;i++)r.plan.push({done:false,time:null});
  }
  return r;
}
function planSessions(key){return PLAN[weekdayOf(key)];}
function totalSessions(key){var r=rec(key);return r.plan.length+r.custom.length;}
function doneCount(key){var r=rec(key);var c=0,i;for(i=0;i<r.plan.length;i++)if(r.plan[i].done)c++;for(i=0;i<r.custom.length;i++)if(r.custom[i].done)c++;return c;}
function sumDur(key){var s=planSessions(key);var t=0,i;for(i=0;i<s.length;i++)t+=s[i].dur;var r=rec(key);for(i=0;i<r.custom.length;i++)t+=(r.custom[i].dur||0);return t;}
function isFull(key){var r=rec(key);if(r.plan.length===0)return false;for(var i=0;i<r.plan.length;i++)if(!r.plan[i].done)return false;return true;}

/* ===== 統計畫面 ===== */
function keyToLabel(key){
  var d=dateObj(key);
  return {md:(d.getMonth()+1)+'月'+d.getDate()+'日',wd:DAYNAME[d.getDay()]};
}
function currentMondayKey(){
  var d=new Date();var w=d.getDay()===0?7:d.getDay();
  d.setDate(d.getDate()-(w-1));
  return keyOf(d);
}
function streakCount(){
  var key=todayKey();
  if(!isFull(key))key=shiftKey(key,-1);
  var n=0;
  while(isFull(key)){n++;key=shiftKey(key,-1);}
  return n;
}
function weekStats(){
  var mon=currentMondayKey(),done=0,total=0,days=[],i;
  for(i=0;i<7;i++){
    var k=shiftKey(mon,i),d=doneCount(k),t=totalSessions(k);
    done+=d;total+=t;
    days.push({d:d,t:t,label:DAYNAME[weekdayOf(k)].slice(1)});
  }
  return {done:done,total:total,days:days,rate:total?Math.round(done/total*100):0};
}
function totalAllCheckins(){
  var n=0,k,i;
  for(k in state.records){
    var r=state.records[k];
    for(i=0;i<r.plan.length;i++)if(r.plan[i].done)n++;
    for(i=0;i<r.custom.length;i++)if(r.custom[i].done)n++;
  }
  return n;
}

/* ===== 番茄鐘 ===== */
function ytId(url){
  var m=String(url).match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  return m?m[1]:null;
}
function pomoDurSec(mode){return (state.pomo.dur[mode]||25)*60;}
function pomoDurMin(mode){return state.pomo.dur[mode]||25;}
function switchPomo(mode,auto){
  var p=state.pomo;
  p.mode=mode;p.left=pomoDurSec(mode);p.running=!!auto;
  p.endAt=auto?Date.now()+p.left*1000:null;
  save();updatePomoUI();
}
function startPomo(){
  var p=state.pomo;
  if(p.left<=0)p.left=pomoDurSec(p.mode);
  p.running=true;p.endAt=Date.now()+p.left*1000;
  save();updatePomoUI();
}
function pausePomo(){
  var p=state.pomo;
  if(p.running){
    p.left=Math.max(0,Math.round((p.endAt-Date.now())/1000));
    p.running=false;p.endAt=null;save();updatePomoUI();
  }
}
function resetPomo(){
  var p=state.pomo;
  p.running=false;p.endAt=null;p.left=pomoDurSec(p.mode);
  save();updatePomoUI();
}
function adjustDur(k,d){
  var p=state.pomo;
  if(p.running)return;
  p.dur[k]=Math.min(120,Math.max(1,p.dur[k]+d));
  if(p.mode===k)p.left=p.dur[k]*60;
  save();updatePomoUI();
  var el=document.getElementById('dv'+k);if(el)el.textContent=p.dur[k];
}
function beep(){
  try{
    var Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    var ctx=new Ctx();
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.value=880;g.gain.value=0.22;
    o.connect(g);g.connect(ctx.destination);
    o.frequency.setValueAtTime(880,ctx.currentTime);
    o.frequency.setValueAtTime(660,ctx.currentTime+0.16);
    o.start();o.stop(ctx.currentTime+0.36);
    o.onended=function(){try{ctx.close();}catch(e){}};
  }catch(e){}
}
function pomoComplete(){
  beep();
  if(navigator.vibrate){try{navigator.vibrate([200,100,200]);}catch(e){}}
  var p=state.pomo;
  if(p.mode==='focus'){
    p.total++;
    p.focusInCycle=(p.focusInCycle+1)%4;
    switchPomo(p.focusInCycle===0?'long':'short',true);
  }else{
    switchPomo('focus',true);
  }
}
function tick(){
  var p=state.pomo;
  if(!p.running)return;
  var rem=Math.max(0,Math.round((p.endAt-Date.now())/1000));
  p.left=rem;save();updatePomoUI();
  if(rem<=0)pomoComplete();
}
function updatePomoUI(){
  var p=state.pomo;
  var el=document.getElementById('pomoTime');
  if(el)el.textContent=pad(Math.floor(p.left/60))+':'+pad(p.left%60);
  var ringEl=document.getElementById('pomoRing');
  if(ringEl){
    var circ=2*Math.PI*84,durSec=pomoDurSec(p.mode);
    var frac=durSec>0?p.left/durSec:0;if(frac<0)frac=0;if(frac>1)frac=1;
    ringEl.innerHTML='<svg class="pomo-ring" viewBox="0 0 200 200" width="200" height="200">'+
      '<circle class="bg" cx="100" cy="100" r="84" fill="none" stroke-width="10"></circle>'+
      '<circle class="fg" cx="100" cy="100" r="84" fill="none" stroke-width="10" stroke-dasharray="'+circ+'" stroke-dashoffset="'+(circ*(1-frac))+'" transform="rotate(-90 100 100)"></circle></svg>';
  }
  var modes=document.querySelectorAll('#view-pomodoro .mode-btn');
  for(var i=0;i<modes.length;i++)modes[i].classList.toggle('active',modes[i].getAttribute('data-mode')===p.mode);
  var st=document.getElementById('pomoStart');
  if(st)st.textContent=p.running?'暫停':'開始';
  var sj=document.getElementById('pomoSubj');
  if(sj)sj.textContent=p.subject?('正在為「'+p.subject+'」計時'):'自由專注';
  var dots=document.getElementById('pomoDots');
  if(dots){
    var hd='';
    for(var j=0;j<4;j++)hd+='<span class="dot'+(j<p.focusInCycle?' filled':'')+'"></span>';
    dots.innerHTML=hd+'<span class="dot-note">今日完成 <b>'+p.total+'</b> 顆番茄</span>';
  }
  var note=document.getElementById('pomoNote');
  if(note)note.textContent=p.mode==='focus'?'專注時間，專心學習':'休息時間，起來活動一下';
}

  var durs=document.querySelectorAll('#view-pomodoro [data-dur]');
  for(var j=0;j<durs.length;j++){
    (function(db){db.addEventListener('click',function(){adjustDur(db.getAttribute('data-dur'),parseInt(db.getAttribute('data-d'),10));});})(durs[j]);
  }
  document.getElementById('musicPlay').addEventListener('click',function(){
    var u=document.getElementById('musicUrl').value.trim();
    if(u)playMusic(u);
  });
  /* 顯示目前設定值 */
  var p=state.pomo;
  var f=document.getElementById('dvfocus');if(f)f.textContent=p.dur.focus;
  var s=document.getElementById('dvshort');if(s)s.textContent=p.dur.short;
  var l=document.getElementById('dvlong');if(l)l.textContent=p.dur.long;
  var mu=document.getElementById('musicUrl');if(mu)mu.value=state.music.url;
  updatePomoUI();
  renderMusicInto();
}

/* ===== 互動事件 ===== */
document.addEventListener('click',function(e){
  var btn=e.target.closest('button[data-act]');
  if(!btn)return;
  var act=btn.getAttribute('data-act'),key=todayKey(),r,it,type,idx;
  if(act==='check'||act==='uncheck'){
    type=btn.getAttribute('data-type');idx=+btn.getAttribute('data-idx');
    r=rec(key);it=type==='plan'?r.plan[idx]:r.custom[idx];
    it.done=(act==='check');it.time=it.done?nowTime():null;
    save();renderToday();
  }else if(act==='delcustom'){
    idx=+btn.getAttribute('data-idx');
    rec(key).custom.splice(idx,1);save();renderToday();
  }else if(act==='pomo'){
    state.pomo.subject=btn.getAttribute('data-subj')||'';
    save();location.hash='pomodoro';
  }
});

/* ===== 路由 ===== */
function todayKey(){return keyOf(new Date());}
function updateHead(){
  var k=todayKey(),lab=keyToLabel(k);
  document.getElementById('headDateLabel').textContent=lab.md;
  document.getElementById('headDateSub').textContent=lab.wd+(isWeekendKey(k)?' · 假日':'');
}
var RENDER={today:renderToday,plan:renderPlan,stats:renderStats,history:renderHistory,pomodoro:renderPomodoro};
function route(){
  var h=(location.hash||'#today').replace('#','');
  if(!RENDER[h])h='today';
  var views=document.querySelectorAll('.view'),i;
  for(i=0;i<views.length;i++)views[i].classList.toggle('active',views[i].getAttribute('data-route')===h);
  var tabs=document.querySelectorAll('.tab');
  for(i=0;i<tabs.length;i++)tabs[i].classList.toggle('active',tabs[i].getAttribute('data-go')===h);
  RENDER[h]();
}
window.addEventListener('hashchange',route);
var tabs=document.querySelectorAll('.tab');
for(var ti=0;ti<tabs.length;ti++){
  (function(t){t.addEventListener('click',function(){location.hash=t.getAttribute('data-go');});})(tabs[ti]);
}

/* ===== 初始化 ===== */
route();
setInterval(tick,500);
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});
}
})();
</script>
